<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Guess ur next anime!</title>
<meta name="description" content="Cyberpunk-style random anime & manga picker." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --neon-pink:#ff2bd6;
    --neon-cyan:#00f0ff;
    --neon-violet:#9d4bff;
  }
  *{box-sizing:border-box;border:0;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Rajdhani",system-ui,sans-serif;color:#f5f0ff;background:#05010d;overflow-x:hidden;
  }
  .cyber-root{position:relative;min-height:100vh;overflow:hidden}
  .cyber-bg{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(5,1,20,0.55), rgba(5,1,20,0.7)),
      url("./cyber-city.jpg");
    background-size:cover;background-position:center bottom;
    animation:cityZoom 30s ease-in-out infinite alternate;
  }
  @keyframes cityZoom{0%{transform:scale(1)}100%{transform:scale(1.08)}}
  canvas.rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .cyber-scan{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;z-index:2;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
  }
  main{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px}
  h1{
    font-family:"Orbitron",sans-serif;font-weight:700;color:#fff;
    font-size:clamp(2rem,5vw,3.75rem);letter-spacing:.04em;text-align:center;margin-bottom:24px;
    text-shadow:0 0 8px rgba(255,43,214,.8),0 0 22px rgba(0,240,255,.5),0 0 60px rgba(157,75,255,.6);
  }
  .mode{
    display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;
  }
  .mode button{
    font-family:"Orbitron",sans-serif;font-size:13px;letter-spacing:.06em;
    padding:10px 18px;border-radius:9999px;cursor:pointer;color:#fff;
    background:rgba(0,0,0,.45);border:1px solid rgba(0,240,255,.4);transition:.2s;
  }
  .mode button:hover{border-color:var(--neon-cyan)}
  .mode button.on{
    background:linear-gradient(120deg,var(--neon-cyan),var(--neon-pink));
    border-color:transparent;box-shadow:0 0 18px rgba(0,240,255,.5),0 0 30px rgba(255,43,214,.4);
  }
  .panel{
    width:100%;max-width:640px;border-radius:18px;padding:28px;
    background:rgba(10,4,28,.55);
    -webkit-backdrop-filter:blur(6px) saturate(130%);
            backdrop-filter:blur(6px) saturate(130%);
    border:1px solid rgba(0,240,255,.25);
    box-shadow:0 0 40px rgba(255,43,214,.18),inset 0 0 30px rgba(0,240,255,.07);
  }
  .label{display:block;font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:8px;color:var(--neon-pink)}
  .go{
    width:100%;padding:16px;border-radius:12px;color:#fff;cursor:pointer;
    font-family:"Orbitron",sans-serif;font-weight:600;font-size:18px;letter-spacing:.04em;
    background:linear-gradient(120deg,var(--neon-pink),var(--neon-violet) 50%,var(--neon-cyan));
    background-size:200% 200%;
    border:1px solid rgba(255,255,255,.15);
    text-shadow:0 0 12px rgba(0,0,0,.4);
    box-shadow:0 0 30px rgba(255,43,214,.45),0 0 60px rgba(0,240,255,.25);
    animation:btnShift 6s ease infinite;transition:transform .15s;
  }
  .go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 40px rgba(255,43,214,.7),0 0 80px rgba(0,240,255,.4)}
  .go:disabled{opacity:.7;cursor:progress}
  @keyframes btnShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .filters{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:"Rajdhani",sans-serif;font-weight:600;font-size:14px;
    padding:6px 14px;border-radius:9999px;cursor:pointer;
    border:1px solid rgba(0,240,255,.35);color:rgba(245,240,255,.85);background:rgba(0,0,0,.35);
    transition:.15s;
  }
  .chip:hover{border-color:var(--neon-cyan);color:#fff}
  .chip.on{
    background:linear-gradient(120deg,var(--neon-pink),var(--neon-violet));
    color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(255,43,214,.55);
  }
  .filters-wrap{margin-top:24px}
  .err{margin-top:14px;font-size:14px;color:var(--neon-pink)}
  .result{
    margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:16px;border-radius:12px;color:inherit;
    background:rgba(0,0,0,.45);border:1px solid rgba(255,43,214,.35);
    animation:fadeUp .4s ease-out;
  }
  .result img{max-height:320px;width:auto;border-radius:8px;box-shadow:0 0 30px rgba(255,0,170,.4)}
  .result h2{font-size:20px;font-weight:600;color:#fff;text-align:center}
  .result p{font-size:14px;line-height:1.55;color:rgba(255,255,255,.82);text-align:center}
  .cta{
    display:inline-block;margin-top:4px;padding:10px 22px;border-radius:9999px;text-decoration:none;
    font-family:"Orbitron",sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;color:#fff;
    background:linear-gradient(120deg,var(--neon-cyan),var(--neon-pink));
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 0 20px rgba(0,240,255,.45),0 0 40px rgba(255,43,214,.35);
    transition:.15s;
  }
  .cta:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(0,240,255,.7),0 0 60px rgba(255,43,214,.55)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  footer{position:fixed;bottom:8px;right:12px;z-index:20;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
  <div class="cyber-root">
    <div class="cyber-bg"></div>
    <canvas id="rain" class="rain"></canvas>
    <div class="cyber-scan"></div>
    <main>
      <h1>Guess ur next anime!</h1>

      <div class="mode" id="mode">
        <button data-mode="anime" class="on">i want a new anime</button>
        <button data-mode="manga">i want a new manga</button>
      </div>

      <section class="panel">
        <button id="go" class="go">Your next anime will be…</button>

        <div class="filters-wrap">
          <p class="label">filters</p>
          <div id="filters" class="filters"></div>
        </div>

        <p id="err" class="err" style="display:none"></p>
        <div id="result" class="result" style="display:none">
          <img id="rImg" alt="" />
          <h2 id="rTitle"></h2>
          <p id="rSyn"></p>
          <a id="rLink" class="cta" target="_blank" rel="noreferrer">click here and see it!</a>
        </div>
      </section>
    </main>
    <footer>Uma iniciativa de Luiza Sena.</footer>
  </div>

<script>
  // ---------- Rain (small droplets) ----------
  (function(){
    const c=document.getElementById("rain"), ctx=c.getContext("2d");
    let w=0,h=0,drops=[];
    function resize(){
      w=c.width=innerWidth; h=c.height=innerHeight;
      const n=Math.floor(w*h/3500); drops=[];
      for(let i=0;i<n;i++)drops.push({
        x:Math.random()*w,y:Math.random()*h,
        len:2+Math.random()*4,sp:8+Math.random()*12,
        a:.35+Math.random()*.45
      });
    }
    resize(); addEventListener("resize",resize);
    (function loop(){
      ctx.clearRect(0,0,w,h);
      for(const d of drops){
        ctx.beginPath();
        ctx.strokeStyle="rgba(185,220,255,"+d.a+")";
        ctx.lineWidth=1;ctx.lineCap="round";
        ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-.8,d.y+d.len);ctx.stroke();
        d.y+=d.sp; d.x-=.4;
        if(d.y>h){d.y=-d.len;d.x=Math.random()*w}
      }
      requestAnimationFrame(loop);
    })();
  })();

  // ---------- Catalog ----------
  // Jikan genre IDs differ between anime and manga endpoints in some cases.
  // For our shared chips we send the same ID — Jikan accepts these for both.
  const GENRES=[
    {label:"Romance",genre:"Romance"},
    {label:"Shounen",tag:"Shounen"},
    {label:"Shoujo",tag:"Shoujo"},
    {label:"Seinen",tag:"Seinen"},
    {label:"Josei",tag:"Josei"},
    {label:"Horror",genre:"Horror"},
    {label:"Action",genre:"Action"},
    {label:"Adventure",genre:"Adventure"},
    {label:"Comedy",genre:"Comedy"},
    {label:"Fantasy",genre:"Fantasy"},
    {label:"Sci-Fi",genre:"Sci-Fi"},
    {label:"Mystery",genre:"Mystery"},
    {label:"Sports",genre:"Sports"},
    {label:"Drama",genre:"Drama"},
    {label:"Slice of Life",genre:"Slice of Life"},
    {label:"Mecha",genre:"Mecha"},
    {label:"Supernatural",genre:"Supernatural"},
    {label:"Psychological",genre:"Psychological"},
    {label:"Thriller",genre:"Thriller"},
    {label:"Music",genre:"Music"},
    {label:"Historical",tag:"Historical"},
    {label:"Isekai",tag:"Isekai"},
  ];

  const ANILIST_QUERY = `query ($page: Int, $type: MediaType, $genres: [String], $tags: [String]) {
    Page(page: $page, perPage: 25) {
      media(type: $type, genre_in: $genres, tag_in: $tags, sort: POPULARITY_DESC, isAdult: false) {
        title { romaji english }
        coverImage { extraLarge large }
        siteUrl
        description
      }
    }
  }`;

  function stripHtml(s){return (s||"").replace(/<br\s*\/?>/gi," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim()}

  const LOADING=[
    "scanning the multiverse…",
    "rewinding the timeline…",
    "decrypting otaku frequencies…",
    "asking the council of mangakas…",
    "tuning into the astral feed…",
    "hacking into the akashic records…",
    "summoning a random protagonist…",
    "rolling the gacha of fate…",
    "buffering parallel dimensions…",
    "calling Madoka for advice…",
    "negotiating with the shinigami…",
    "consulting the ancient scrolls…",
    "loading 108 plot twists…",
    "powering up to 9000…",
  ];

  let mode="anime";
  const active=new Set();

  // Mode toggle
  const modeEl=document.getElementById("mode");
  modeEl.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    mode=b.dataset.mode;
    modeEl.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    document.querySelector("h1").textContent = mode==="anime" ? "Guess ur next anime!" : "Guess ur next manga!";
    goBtn.textContent = mode==="anime" ? "Your next anime will be…" : "Your next manga will be…";
    document.getElementById("result").style.display="none";
    document.getElementById("err").style.display="none";
  });

  // Filters
  const fEl=document.getElementById("filters");
  GENRES.forEach(g=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=g.label;b.dataset.key=g.label;
    b.onclick=()=>{
      if(active.has(g.label)){active.delete(g.label);b.classList.remove("on")}
      else{active.add(g.label);b.classList.add("on")}
    };
    fEl.appendChild(b);
  });

  const goBtn=document.getElementById("go");
  const errEl=document.getElementById("err");
  const resEl=document.getElementById("result");
  const rImg=document.getElementById("rImg");
  const rTitle=document.getElementById("rTitle");
  const rSyn=document.getElementById("rSyn");
  const rLink=document.getElementById("rLink");

  async function pick(){
    goBtn.disabled=true;
    const original = mode==="anime" ? "Your next anime will be…" : "Your next manga will be…";
    goBtn.textContent=LOADING[Math.floor(Math.random()*LOADING.length)];
    errEl.style.display="none";resEl.style.display="none";
    try{
      const chosen=GENRES.filter(g=>active.has(g.label));
      const genres=chosen.map(g=>g.genre).filter(Boolean);
      const tags=chosen.map(g=>g.tag).filter(Boolean);
      async function run(page){
        const r=await fetch("https://graphql.anilist.co",{
          method:"POST",
          headers:{"Content-Type":"application/json",Accept:"application/json"},
          body:JSON.stringify({query:ANILIST_QUERY,variables:{page:page,type:mode==="anime"?"ANIME":"MANGA",genres:genres.length?genres:null,tags:tags.length?tags:null}})
        });
        if(!r.ok)throw new Error("Failed to reach the archives. Try again.");
        const j=await r.json();
        if(j.errors&&j.errors.length)throw new Error("Failed to reach the archives. Try again.");
        return (j.data&&j.data.Page&&j.data.Page.media)||[];
      }
      let list=await run(Math.floor(Math.random()*8)+1);
      if(!list.length)list=await run(1);
      if(!list.length){errEl.textContent="Nothing matched. Try other filters.";errEl.style.display="block";return}
      const a=list[Math.floor(Math.random()*list.length)];
      rImg.src=(a.coverImage&&(a.coverImage.extraLarge||a.coverImage.large))||"";
      rTitle.textContent=(a.title&&(a.title.english||a.title.romaji))||"Unknown transmission";
      rImg.alt=rTitle.textContent;
      rSyn.textContent=stripHtml(a.description)||"No synopsis available for this transmission.";
      rLink.href=a.siteUrl;
      resEl.style.display="flex";
    }catch(e){errEl.textContent=e.message||"Something glitched in the matrix.";errEl.style.display="block"}
    finally{goBtn.disabled=false;goBtn.textContent=original}
  }
  goBtn.addEventListener("click",pick);
</script>
</body>
</html>
